[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "barbot"
version = "4.4.3"
description = "BarBot4 Raspberry Pi Python application"
authors = [{ name = "Robert2611" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Add your runtime dependencies here, e.g.:
    "PyQt5>=5.15.0",
    "pyyaml",
    "psutil",
    "platformdirs",
]

[project.scripts]
barbot = "barbot.__main__:main"
barbot-with-log = "barbot.__main__:main"
barbot-demo = "barbot.__main__:main"
barbot-tools = "barbot.barbottools:main"
barbot-setup = "barbot.setup:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-qt"]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools]
include-package-data = true

[tool.pytest.ini_options]
testpaths = ["test"]
markers = ["timeout: mark test to fail after a timeout"]
